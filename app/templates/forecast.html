<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Прогнозирование расходов</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; background:#f8fafc; color:#111; margin:0; padding:20px; }
    h1 { text-align:center; margin-bottom:30px; }
    fieldset { border:1px solid #ddd; border-radius:8px; padding:15px; background:#fff; width:fit-content; margin:0 auto 30px; }
    input, select, button { padding:8px 10px; margin:4px; border:1px solid #ccc; border-radius:6px; }
    button { background:#2563eb; color:#fff; border:none; cursor:pointer; }
    button:hover { background:#1e4fcc; }
    .tabs { display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
    .tab { padding:8px 14px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .tab.active { background:#2563eb; color:#fff; border-color:#2563eb; }
    .section { display:none; }
    .section.active { display:block; }
    canvas { width:100%; max-height:400px; margin-top:20px; background:#fff; }
    table { width:100%; border-collapse:collapse; margin-top:20px; background:#fff; }
    th, td { border:1px solid #ddd; padding:10px; text-align:center; }
    th { background:#f1f5f9; }
    .warning { color:#b91c1c; font-weight:bold; margin-top:10px; }
  </style>
</head>

<body>

<h1>Прогнозирование расходов</h1>

<!-- ВКЛАДКИ -->
<div class="tabs">
  <div class="tab active" data-tab="linear">Линейная регрессия</div>
  <div class="tab" data-tab="arima">ARIMA</div>
  <div class="tab" data-tab="mlp">MLP</div>
  <div class="tab" data-tab="compare">Сравнение</div>
</div>

<!-- ОБЩАЯ ФОРМА -->
<form id="forecastForm">
  <fieldset>
    <legend>📅 Параметры прогнозирования</legend>

    <label>Период с:</label>
    <input type="month" name="month_from" required>

    <label>по:</label>
    <input type="month" name="month_to" required>

    <label>Прогнозировать:</label>
    <input type="number" name="predict_months" value="12" min="1" max="24">

    <button type="submit">Построить</button>
    <a href="/forecast"><button type="button">Сбросить</button></a>
    <a href="/expenses"><button type="button">Назад</button></a>

    <div id="errorMessage" class="warning"></div>
  </fieldset>
</form>

<!-- LINEAR -->
<div id="linear" class="section active">
  <canvas id="linearChart"></canvas>
  <table><thead><tr><th>Месяц</th><th>Факт</th><th>Прогноз</th></tr></thead>
  <tbody id="linearTable"></tbody></table>
</div>

<!-- ARIMA -->
<div id="arima" class="section">
  <div id="arimaWarning" class="warning"></div>
  <canvas id="arimaChart"></canvas>
  <table><thead><tr><th>Месяц</th><th>Факт</th><th>Прогноз</th></tr></thead>
  <tbody id="arimaTable"></tbody></table>
</div>

<!-- MLP -->
<div id="mlp" class="section">
  <canvas id="mlpChart"></canvas>
  <table><thead><tr><th>Месяц</th><th>Факт</th><th>Прогноз</th></tr></thead>
  <tbody id="mlpTable"></tbody></table>
</div>

<!-- СРАВНЕНИЕ -->
<div id="compare" class="section">
  <canvas id="compareChart"></canvas>
  <table>
    <thead>
      <tr><th>Месяц</th><th>Факт</th><th>Linear</th><th>ARIMA</th><th>MLP</th></tr>
    </thead>
    <tbody id="compareTable"></tbody>
  </table>
</div>

<script>
  // ВКЛАДКИ
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
    });
  });

  let charts = { linear: null, arima: null, mlp: null, compare: null };

  document.getElementById("forecastForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const params = new URLSearchParams(new FormData(e.target));
    const res = await fetch(`/forecast/build?${params.toString()}`);
    const data = await res.json();

    if (data.error) {
      document.getElementById("errorMessage").textContent = data.error;
      return;
    }

    const {
      months, actual_values,
      linear_predicted, arima_predicted, mlp_predicted,
      used_fallback
    } = data;

    // === ARIMA Fallback ===
    const warn = document.getElementById("arimaWarning");
    warn.textContent = used_fallback ? "⚠ ARIMA не смогла обучиться — используется усреднённый прогноз." : "";

    // === LINEAR ===
    fillTable("linearTable", months, actual_values, linear_predicted);
    renderChart("linearChart", months, actual_values, linear_predicted, "#2563eb");

    // === ARIMA ===
    fillTable("arimaTable", months, actual_values, arima_predicted);
    renderChart("arimaChart", months, actual_values, arima_predicted, "#9333ea");

    // === MLP ===
    fillTable("mlpTable", months, actual_values, mlp_predicted);
    renderChart("mlpChart", months, actual_values, mlp_predicted, "#f59e0b");

    // === COMPARE ===
    fillCompareTable(months, actual_values, linear_predicted, arima_predicted, mlp_predicted);
    renderCompareChart(months, actual_values, linear_predicted, arima_predicted, mlp_predicted);
  });

  function fillTable(id, months, actual, predicted) {
    const tbody = document.getElementById(id);
    tbody.innerHTML = "";

    months.forEach((m, i) => {
      tbody.innerHTML += `
      <tr>
        <td>${m}</td>
        <td>${actual[i] != null ? actual[i].toFixed(0) : "-"}</td>
        <td>${predicted[i] != null ? predicted[i].toFixed(0) : "-"}</td>
      </tr>`;
    });
  }

  function fillCompareTable(months, a, l, ar, m) {
    const tbody = document.getElementById("compareTable");
    tbody.innerHTML = "";

    months.forEach((month, i) => {
      tbody.innerHTML += `
      <tr>
        <td>${month}</td>
        <td>${Math.round(a[i]) ?? "-"}</td>
        <td>${Math.round(l[i]) ?? "-"}</td>
        <td>${Math.round(ar[i]) ?? "-"}</td>
        <td>${Math.round(m[i]) ?? "-"}</td>
      </tr>`;
    });
  }

  function renderChart(id, labels, a, p, color) {
    if (charts[id]) charts[id].destroy();

    charts[id] = new Chart(document.getElementById(id), {
      type: "line",
      data: {
        labels,
        datasets: [
          { label: "Факт", data: a, borderColor: "#16a34a", tension: 0.2 },
          { label: "Прогноз", data: p, borderColor: color, borderDash: [4,4], tension: 0.2 }
        ]
      },
      options: {
        animation: false,
        plugins: { legend: { position: 'bottom' } },
        animations: { tension: { duration: 0 }, x:{duration:0}, y:{duration:0} }
      }
    });
  }

  function renderCompareChart(labels, a, l, ar, m) {
    if (charts.compare) charts.compare.destroy();

    charts.compare = new Chart(document.getElementById("compareChart"), {
      type: "line",
      data: {
        labels,
        datasets: [
          { label:"Факт", data:a, borderColor:"#16a34a", tension: 0.2 },
          { label:"Linear", data:l, borderColor:"#2563eb", borderDash:[4,4], tension: 0.2 },
          { label:"ARIMA", data:ar, borderColor:"#9333ea", borderDash:[6,4], tension: 0.2 },
          { label:"MLP", data:m, borderColor:"#f59e0b", borderDash:[2,4], tension: 0.2 },
        ]
      },
      options: {
        animation: false,
        plugins:{ legend:{ position:'bottom' } },
        animations:{ tension:{duration:0}, x:{duration:0}, y:{duration:0} }
      }
    });
  }
</script>

</body>
</html>
