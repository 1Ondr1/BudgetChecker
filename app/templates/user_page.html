<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль {{ user.login }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; text-align: center; }
        .card {
            background: white;
            padding: 2rem;
            margin: 4rem auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Добро пожаловать, {{ user.login }}!</h2>
        <p>Email: {{ user.email }}</p>
        <p>Дата регистрации: {{ user.create_date.strftime('%d.%m.%Y') }}</p>
        <a href="/expenses">Затраты</a>
        <a href="/auth/logout">Выйти</a>
    </div>
</body>
</html>
